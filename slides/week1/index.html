              ### Linux 🐧
              ---
              <!-- .slide: style="font-size: 0.8em" -->
              ### What is an operating system?
              An operating system is a piece of software that manages the hardware of a computer and provides an interface to the programs that run on the computer.

              This means that user level programs do not need to know the details of the hardware.
              They use code that interfaces with the operating system (syscalls).
              And the operating system handles the details of the hardware.

              So user level programs can be written once and run on many different computers.
              ---
              <!-- .slide: style="font-size: 0.8em" -->
              ### What operating system do you use?
              This course is teaches you to work with tools within Linux. The things taught in this course might not apply to Windows or MacOS.

              You will need to work in a Linux environment using a Linux VM or WSL2 or CSE Servers (TigerVNC or VSCode SSHFS)

              ```shell
              $ uname -a
              Linux ccws02 6.12.90+deb13.1-amd64 #1 SMP PREEMPT_DYNAMIC
              Debian 6.12.90-2 (2026-05-27) x86_64 GNU/Linux
              ```
            </textarea>
          </section>

              ## Regex
              ---
              <!-- .slide: style="font-size: 0.8em" -->
              ### What is Regex?
              Regex (short for regular expression) is a way to describe a pattern in text so a computer can find or match text with that pattern.

              https://regex101.com/
              ---
              <!-- .slide: style="font-size: 0.7em" -->
              ## Regex Guide
              **Character classes**: Distinguish different kinds of characters.

              |           |                                                            |
              |-----------|------------------------------------------------------------|
              | abc123    | Pattern: Matches the string of characters abc123           |
              | [abc123]  | List: Matches one character either a, b, c, 1, 2 or 3      |
              | [a-c1-3]  | Same as [abc123] but using - to specify range              |
              | [^xyz]    | Not: Matches one character that is not x, y or z           |
              | .         | Wildcard: Matches one character of any character           |
              | abc\|xyz  | Or: Matches the pattern abc or xyz                         |
              | \         | Escape: Removes special meaning of characters              |
              | \s        | Space: Matches a white space (includes tabs)               |
              | (pattern) | Brackets group an expression together like in maths        |
              |           |                                                            |
              ---
              <!-- .slide: style="font-size: 0.7em" -->
              ## Regex Guide
              **Assertions**: Boundaries which indicate the beginnings and endings of lines and words, and patterns.

              |    |                                                   |
              |----|---------------------------------------------------|
              | ^  | Anchor: Start matching from the start of a line   |
              | $  | Anchor: Start matching from the end of a line     |
              | \b | Word Boundary: Matches the start or end of a word |
              |    |                                                   |
              ---
              <!-- .slide: style="font-size: 0.7em" -->
              ## Regex Guide
              **Quantifiers**: Numbers of characters or expressions to match.

              |          |                                        |
              | -------- | -------------------------------------- |
              | x*       | Matches zero or more repetitions of x  |
              | x+       | Matches one or more occurrence of x    |
              | x?       | Matches zero or one occurrence of x    |
              | x{n}     | Matches n occurrences of x             |
              | x{n,m}   | Matches n to m repetitions of x        |
              | x{n,}    | Matches n or more repetitions of x     |
              | x{,m}    | Matches m or less repetitions of x     |
              |          |                                        |

              ## Grep 🕵️
              ---
              <!-- .slide: style="font-size: 0.8em" -->
              ### What is Grep?
              `Grep` is a command-line tool used to search for text patterns in files or input. It's commonly found on Linux and macOS but not on Windows.

              <div style="text-align: center;">
                  <pre style="font-size: 0.9em; display: inline-block; text-align: center;">
                    <code class="language-shell">$ grep "regex" filename.txt</code>
                  </pre>
              </div>
              ---
              <!-- .slide: style="font-size: 0.7em" -->
              ## Grep Options
              See manual page for grep for full options
              <pre style="font-size: 0.9em; text-align: center;">
                <code class="language-shell">$ man 1 grep</code>
              </pre>
              |    |                                                                   |
              |----|-------------------------------------------------------------------|
              | -E | Extended Regex: This is the regex taught in the course (use this) |
              | -G | Basic Regex: Default grep                                         |
              | -F | Fixed Strings: Only matches strings (Same as Ctrl F)              |
              | -i | Ignore Case: Ignores upper/lower case when matching               |
              | -v | Invert Match: Only print non matching lines                       |
              | -c | Count: Print the number of lines that matches the regex           |
              | -P | Perl Regex: Has extra features, not taught in this course         |
              |    |                                                                   |
